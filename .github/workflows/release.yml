# 发版：推一个 v* 标签（版本号要和根目录 package.json 的 version 一样），自动：
#   1. 跑测试
#   2. 生成桌面版热更新用的游戏包 game-<版本>.json.gz + manifest
#   3. 在 Linux 上打 AppImage、在 Windows 上打安装包和免安装版
# 全部挂到这个标签的 GitHub Release 上。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 标签要和 package.json 的版本一致
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: 测试
        run: |
          npm install --no-save --package-lock=false esbuild@0.28.2 typescript@5.9.3 @types/node@20.19.43
          npm run build
          npm test
          npm run typecheck
      - name: 游戏包
        run: node apps/desktop/scripts/release-game.mjs dist-game
      - name: 改动说明（CHANGELOG 这一版的小节 + 下载指引；GitHub 再在后面接 PR 与贡献者列表）
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<'NOTES'

          ### 下载
          - **Windows**：`dsh-piggy-setup-*.exe`（安装版）或 `dsh-piggy-portable-*.exe`（免安装，双击就跑）
          - **Linux**：`dsh-piggy-*.AppImage`（加执行权限后双击）
          - **DSH 插件**：`dsh plugin --profile web add dsh-piggy`，装完重启 dsh
          - 已装桌面版的：主屏「🔄 更新」一键升级
          NOTES
      - name: 建 Release 并上传游戏包
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist-game/* --clobber

  desktop:
    needs: game
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: apps/desktop }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 装依赖
        run: npm ci
      - name: 打包
        shell: bash
        run: |
          node scripts/pack-game.mjs
          npx electron-builder ${{ matrix.target }} --publish never
      - name: 上传安装包
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.exe)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
