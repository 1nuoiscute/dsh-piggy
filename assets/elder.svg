<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="老年猪">
  <!--
    老年猪。结构和 🐖 完全一致（侧面朝左、纯平涂、零描边），
    还是那头猪，只是毛色淡了、背塌了、肚子垂了、耳朵耷拉、眼睛半眯、口鼻发白。
  -->
  <!-- 卷尾巴：还是那个圈，只是颜色更淡 -->
  <path d="M47 25.5c3.2-3.4 6.6-3.8 7-1 .4 2.5-2.4 4.1-4.2 2.9" fill="none"
        stroke="#DCBBA8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 后腿 -->
  <rect x="32" y="41" width="7.5" height="13" rx="3.7" fill="#E5C2B1"/>
  <rect x="21" y="43" width="7.5" height="12" rx="3.7" fill="#E5C2B1"/>
  <!-- 身子：和小猪同一个轮廓，只是更沉、肚子往下一坠 -->
  <path d="M7 45C3 33 7 16.5 19 12.5 31 8.5 45 11 50.5 17.5c5 5.6 5 15-.5 20.6-3.2 3.3-8 4.9-13.4 4.9H15.5c-4.6 0-7.6-1.6-8.5-4z"
        fill="#F1D2C5"/>
  <!-- 前腿 -->
  <rect x="39.5" y="41" width="7.5" height="13.5" rx="3.7" fill="#F1D2C5"/>
  <rect x="13.5" y="43" width="7.5" height="13" rx="3.7" fill="#F1D2C5"/>
  <!-- 口鼻：发白，边缘加一圈淡灰示意年纪 -->
  <ellipse cx="12.5" cy="42" rx="8" ry="6.4" fill="#E9A6A2"/>
  <ellipse cx="10.4" cy="42" rx="1.4" ry="2.1" fill="#4A3B34"/>
  <ellipse cx="15.4" cy="42" rx="1.4" ry="2.1" fill="#4A3B34"/>
  <!-- 眼睛：半眯，上眼皮压掉一半 -->
  <circle cx="21.5" cy="31" r="2.6" fill="#3A2E28"/>
  <path d="M18.4 28.9c1.7-1.7 4.5-1.7 6.2 0" fill="#F1D2C5"/>
  <!-- 耳朵：还是洋红的那对卷，但往下耷拉 -->
  <path d="M14 20.5c-3.8 1.8-6 5.6-5 9" fill="none"
        stroke="#D08CA6" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M31.5 25c-2.6 1.6-4 4.6-3.4 7.4" fill="none"
        stroke="#D08CA6" stroke-width="2.8" stroke-linecap="round"/>
  <!-- 花白的眉毛和下巴杂毛 -->
  <path d="M17.8 26c1.5-1 3.4-1.2 4.8-.8" fill="none"
        stroke="#C9BAB0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M16.4 47.6c1.5 1 3.1 1 4.3 0M23 48.4c1.2.8 2.4.8 3.4 0" fill="none"
        stroke="#C9BAB0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
