<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="小猪">
  <!--
    小猪。和 🐖 同一套结构：侧面朝左、纯平涂、零描边。
    区别只在比例 —— 幼崽脑袋占得更满、腿更短、眼睛更大。
  -->
  <!-- 卷尾巴 -->
  <path d="M47 24.5c3.4-3.6 7-4 7.4-1.1.4 2.6-2.5 4.3-4.3 3" fill="none"
        stroke="#F0BCA0" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 后腿 -->
  <rect x="32" y="39" width="7" height="13" rx="3.5" fill="#F5C0A8"/>
  <rect x="21" y="41" width="7" height="12" rx="3.5" fill="#F5C0A8"/>
  <!-- 身子：头与躯干连成一块，后高前低 -->
  <path d="M8 43C4.5 33 8 19.5 19.5 15.5 31 11.5 43.5 13.5 49 19c4.5 4.5 4.5 12 1 17-2.5 3.5-6.5 5.5-11 5.5H15c-3.5 0-6-1.5-7-3.5z"
        fill="#FAD2BE"/>
  <!-- 前腿 -->
  <rect x="39.5" y="39.5" width="7" height="13" rx="3.5" fill="#FAD2BE"/>
  <rect x="13.5" y="41" width="7" height="13" rx="3.5" fill="#FAD2BE"/>
  <!-- 猪鼻子 -->
  <ellipse cx="12.5" cy="40.5" rx="8" ry="6.4" fill="#F98D8D"/>
  <ellipse cx="10.4" cy="40.5" rx="1.4" ry="2.1" fill="#262626"/>
  <ellipse cx="15.4" cy="40.5" rx="1.4" ry="2.1" fill="#262626"/>
  <!-- 眼睛：幼崽给得大一点、亮一点 -->
  <circle cx="21.5" cy="30.5" r="3" fill="#232323"/>
  <circle cx="22.6" cy="29.4" r="1" fill="#FFFFFF"/>
  <!-- 耳朵：和 emoji 一样的洋红小卷 -->
  <path d="M14.5 21.5c-2-5-.5-8.5 2.6-8s4.4 4.4 2 7.4" fill="none"
        stroke="#D6336C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M31.5 26c-1.4-4.4.6-7.4 3.4-6.6" fill="none"
        stroke="#D6336C" stroke-width="2.8" stroke-linecap="round"/>
</svg>
