17 364 616C382 615 394 601 394 583C394 566 382 553 363 553ZM560 595C542 594 532 610 533 628C534 647 545 659 561 658C579 657 591 643 591 625C591 608 579 595 560 595Z\"/>\n    <path fill=\"#FF8195\" d=\"M408 648C370 636 333 648 318 672C303 697 310 725 338 745C367 767 413 777 449 770C481 764 497 746 490 720C484 690 449 660 408 648Z\"/>\n    <path fill=\"#373A32\" d=\"M359 681C347 681 344 693 348 708C351 722 357 732 368 729C379 727 384 713 380 699C377 687 370 680 359 681ZM422 687C411 686 407 697 407 711C406 725 412 737 423 738C434 738 441 724 441 710C441 697 434 688 422 687Z\"/>\n  ";const eyeMarkup="<path id=\"eyes\" fill=\"#373A32\" d=\"M363 553C345 552 335 568 336 586C337 605 348 617 364 616C382 615 394 601 394 583C394 566 382 553 363 553ZM560 595C542 594 532 610 533 628C534 647 545 659 561 658C579 657 591 643 591 625C591 608 579 595 560 595Z\"/>";const closedEyes="<path fill=\"#373A32\" d=\"M338 580q24 30 52 8q7 -4 9 4q-32 38 -62 1q-7 -10 1 -13ZM535 622q24 30 52 8q7 -4 9 4q-32 38 -62 1q-7 -10 1 -13Z\"/>";const number=value => Number(value.toFixed(3));
function wrap(markup, transform = '') {

function transformAround({ x = 32, y = 54, rotate = 0, scaleX = 1, scaleY = 1, lift = 0 }) {

function character(action, phase) {

  const isClosed = ['eat', 'bathe', 'pet', 'relaxed'].includes(action) || (action === 'idle' && blink);
  let markup = isClosed ? bodyMarkup.replace(eyeMarkup, closedEyes) : bodyMarkup;
  const tail = markup.match(/<path d="M916[^>]*\/>/)[0];

  if (action === 'trip') {

  }

  if (action === 'trip') pig = wrap(pig, `translate(5 7) scale(.84) translate(0 ${number(-.6 * (1 - Math.cos(phase * Math.PI * 4)))})`);

function bath(phase) {

  const rear = '<path fill="#B9D5D9" d="M47 28Q59 23 60 32L60 49L48 49Z"/><path fill="#8DB1B8" d="M44 48L60 48L60 51L44 51ZM48 51H51L50 60H47ZM56 51H59L61 60H58Z"/>';
  const desk = '<rect x="3" y="47" width="34" height="3.5" rx="1.3" fill="#D7AF88"/><path fill="#BE926E" d="M6 50H9L8 60H5ZM32 50H35L36 60H33Z"/><path fill="#89ADB5" d="M11 44H18V47H11Z"/><rect x="3" y="29" width="23" height="16" rx="2" fill="#668C96"/><rect x="5" y="31" width="19" height="11" rx="1.1" fill="#D4F4F1"/><path fill="#89ADB5" d="M8 34H19V35.3H8ZM8 37H15V38.3H8Z"/><rect x="21" y="45" width="11" height="2" rx=".7" fill="#668C96"/>';

function study(phase) {

  const book = '<path fill="#E95892" d="M7 47Q19 44 30 49Q42 44 53 47L52 59Q40 56 30 61Q18 56 8 59Z"/><path fill="#F8F4E8" d="M9 46Q19 44 30 49L30 59Q20 54 10 57ZM30 49Q42 44 51 46L50 57Q40 54 30 59Z"/><path fill="#D7C8B5" d="M13 49Q20 48 26 51L26 52Q20 49 13 50ZM13 53Q20 52 26 55L26 56Q20 53 13 54ZM34 51Q41 48 47 49L47 50Q41 49 34 52Z"/><path fill="#F2C64B" d="M55 43L57 43L58 59L56 59Z"/><path fill="#725D42" d="M56 59L58 59L57 62Z"/>';

}
const cards=[...document.querySelectorAll('[data-action]')];let last=0;function animate(time){if(time-last>1000/30){const phase=(time%3200)/3200;for(const card of cards)card.innerHTML=draw(card.dataset.action,phase);last=time}requestAnimationFrame(animate)}if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(animate);</script></html>
