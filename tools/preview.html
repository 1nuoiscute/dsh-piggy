  // Capture the self-registration instead of loading it as a DSH client plugin.
  let entry = null
  window.__ModuleLoader__ = { load: e => { entry = e } }
  // Serve the snapshot from the route the bundle polls.
  const liveOrStub = () => window.__LIVE || SNAPSHOT
  window.fetch = async () => ({ ok: true, status: 200, async json() { return liveOrStub() } })

  window.pigStub = {
    get snap() { return liveOrStub() },
    ready: false,
    /** The menu is on the context menu; a left click only pats the pig. */
    setOpen(open) {
      const host = document.querySelector('[data-dsh-pig]')
      if (!host) return false
      // Look the scene up by class, not by position: the widget's DOM order has
      // changed more than once, and a positional lookup silently made this
      // helper a no-op (so every "before/after" measurement read the same state).
      const scene = host.querySelector('.dp-scene')
      if (!scene) return false
      const isOpen = host.getAttribute('data-open') === 'true'
      if (isOpen !== open) {
        scene.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }))
      }
      return host.getAttribute('data-open')
    },
    /** Left click = a pat on the head. */
    pet() {
      const scene = document.querySelector('[data-dsh-pig] .dp-scene')
      if (!scene) return false
      scene.dispatchEvent(new PointerEvent('pointerdown', { button: 0, clientX: 10, clientY: 10, bubbles: true }))
      scene.dispatchEvent(new PointerEvent('pointerup', { button: 0, bubbles: true }))
      return true
    },
    /** Drag the pig by a screen delta, exactly like a real drag. */
    dragBy(dx, dy) {
      const scene = document.querySelector('[data-dsh-pig] .dp-scene')
      if (!scene) return false
      const from = { x: 200, y: 200 }
      scene.dispatchEvent(new PointerEvent('pointerdown', { button: 0, clientX: from.x, clientY: from.y, bubbles: true, pointerId: 1 }))
      scene.dispatchEvent(new PointerEvent('pointermove', { clientX: from.x + dx, clientY: from.y + dy, bubbles: true, pointerId: 1 }))
      scene.dispatchEvent(new PointerEvent('pointerup', { button: 0, bubbles: true, pointerId: 1 }))
      return window.pigStub.state()
    },
    /** Pretend the pig is out at something, then wait for a poll to repaint. */
    async away(kind, label, emoji, progress) {
      SNAPSHOT.activity = kind === null ? null : {
        kind, key: 'demo', label, emoji, cost: 0, secondsLeft: 999, progress: progress ?? 40,
      }
      // The real host derives the mood from the activity; mirror that here or the
      // pig keeps its idle pose.
      // The host's mood keys are gerunds (working / studying / traveling), not
      // the activity kind, so map rather than copy.
      const MOOD_OF = { work: 'working', study: 'studying', trip: 'traveling' }
      SNAPSHOT.pig.mood = kind === null ? 'happy' : (MOOD_OF[kind] ?? 'happy')
      await new Promise(r => setTimeout(r, 4300))
      return SNAPSHOT.activity
    },
    tab(key) {
      const btn = document.querySelector(`[data-dsh-pig] [data-tab="${key}"]`)
      if (btn) btn.click()
      return !!btn
    },
    state() {
      const host = document.querySelector('[data-dsh-pig]')
      if (!host) return { mounted: false }
      const card = host.querySelector('.dp-card')
      const scene = host.querySelector('.dp-scene')
      const bar = host.querySelector('.dp-bar')
      const content = host.querySelector('.dp-content')
      const pig = host.querySelector('.dp-pig')
      const r = el => el ? el.getBoundingClientRect() : null
      const box = o => o && ({ x: Math.round(o.x), y: Math.round(o.y), w: Math.round(o.width), h: Math.round(o.height) })
      return {
        mounted: true,
        open: host.getAttribute('data-open'),
        dead: host.getAttribute('data-dead'),
        card: box(r(card)), scene: box(r(scene)), pig: box(r(pig)),
        bar: box(r(bar)), barHidden: !!bar.hidden,
        content: box(r(content)), contentHidden: !!content.hidden,
        cardHidden: !!card.hidden,
        hudHidden: host.querySelector('.dp-hud').hidden,
        pigStyle: {
          position: getComputedStyle(pig).position,
          background: getComputedStyle(pig).backgroundColor,
          borderWidth: getComputedStyle(pig).borderTopWidth,
        },
      }
    },
  }
</script>

  const mod = entry.factory(() => {})
  window.__pigExports = mod
  mod.apply({})
  window.pigStub.ready = true
</script>
