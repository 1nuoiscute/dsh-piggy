const poses={"down":[34,31,36,32,38.5,31,41.5,30.5,41,35,43,40,47.5,42,49,43,47.7,45.4,47.9,46.8,48,49,51.5,48.8,53,50.5,54.1,51.8,50.7,51.4,51.1,53,51.9,56,54.6,57.8,57.7,57.7,59,57.8,59,59,57.4,59.1,46,60.9,34.8,54.1,30,46.4,28,43.5,31.8,43.6,33.2,39,34.2,36.3,34.3,34,34,31],"edge":[34,31,36,28,39,26.5,42,26,46,25.5,52,26,56,27,57,27.8,52.7,27.7,51.7,28,53,29,56,29.8,58,31,58.7,32,53.1,30.5,52,31,53,33,54.6,34.1,56,34,57,34.2,56,35,54.4,35.1,48,37,39,36.5,34,35,33,34.5,34.4,33.5,35,32.8,35.6,32,34.6,31.3,34,31],"up":[34,31,34.5,25,34,19.5,37,18,42,14,51,12.8,57,15,58,16,53.8,16.9,53,18,53.7,20,56.3,20.8,58,23,59,24.4,53.7,23.6,53,25,53.1,28,54.4,31.3,56,32,57,33,56,34,54.6,32.9,49,28,43.5,29.7,36,38,34.6,39.7,35.4,34.4,35,32,34.8,31.5,34.4,31.3,34,31]};
const ribs={"down":[[36.5,40.8,39,42,42,41.8,45.6,41.5],[35.5,44,39,46.5,43,48.5,49,49.2],[35,45.2,40,51.5,47,54.1,53.5,55.3]],"edge":[[38,28.3,43,27.9,47,28.2,53,28.3],[37,30.5,41,31,46,31.3,53,32],[36,31.200000000000003,40,32.5,46,33.4,51,33.3]],"up":[[39,19,43,17.7,48,18.2,52,19.5],[38,22,42,23,46,25,50.2,27.5],[37,22.9,38.6,26.5,38.4,29.5,37.3,32.5]]};
function blendPoses(states,phase){
 const position=1-Math.cos(2*Math.PI*phase),index=Math.min(1,Math.floor(position)),weight=position-index;
 const stops=[states.down,states.edge,states.up];
 const previous=stops[Math.max(0,index-1)],current=stops[index],next=stops[index+1],after=stops[Math.min(2,index+2)];
 const interpolate=([before,from,to,last])=>{
  const slopeFrom=(to-before)/2,slopeTo=(last-from)/2;
  return (2*weight**3-3*weight**2+1)*from+(weight**3-2*weight**2+weight)*slopeFrom+(-2*weight**3+3*weight**2)*to+(weight**3-weight**2)*slopeTo;
 };
 return current.map((value,number)=>Array.isArray(value)?value.map((coordinate,axis)=>interpolate([previous[number][axis],coordinate,next[number][axis],after[number][axis]])):interpolate([previous[number],value,next[number],after[number]]));
}
function outlinePath(values){
 return 'M'+values.slice(0,2).map(value=>value.toFixed(2)).join(' ')+'C'+values.slice(2).map(value=>value.toFixed(2)).join(' ')+'Z';
}
function ribPath(values){
 const edges=[[],[]];
 for(let index=0;index<=20;index++){
  const position=index/20,rest=1-position;
  const center=[0,1].map(axis=>rest**3*values[axis]+3*rest**2*position*values[axis+2]+3*rest*position**2*values[axis+4]+position**3*values[axis+6]);
  const tangent=[0,1].map(axis=>3*rest**2*(values[axis+2]-values[axis])+6*rest*position*(values[axis+4]-values[axis+2])+3*position**2*(values[axis+6]-values[axis+4]));
  const length=Math.hypot(...tangent)||1,width=.4*Math.sin(Math.PI*position);
  for(let side=0;side<2;side++){
   const direction=side===0?1:-1;
   edges[side].push([center[0]-tangent[1]/length*width*direction,center[1]+tangent[0]/length*width*direction]);
  }
 }
 return 'M'+edges[0].concat(edges[1].reverse()).map(point=>point.map(value=>value.toFixed(2)).join(' ')).join('L')+'Z';
}
const preview=document.querySelector('#preview svg');
if (!(preview instanceof SVGSVGElement)) throw new Error('Missing devil preview SVG.');
const character=preview.querySelector('#character');
const pauseButton=document.querySelector('#pause');
if (!(character instanceof SVGGElement) || !(pauseButton instanceof HTMLButtonElement)) throw new Error('Missing animation controls.');
const membranes=['near','far'].map(side=>preview.querySelector('#'+side+'-membrane'));
const wingRibs=['near','far'].map(side=>[0,1,2].map(index=>preview.querySelector('#'+side+'-rib-'+index)));
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
let isPaused=motionPreference.matches;
let elapsed=0;
let previousTime=null;
function renderPhase(phase){
 const states=[poses,{down:poses.down,edge:poses.edge,up:poses.edge}];
 const lineStates=[ribs,{down:ribs.down,edge:ribs.edge,up:ribs.edge}];
 membranes.forEach((path,side)=>path?.setAttribute('d',outlinePath(blendPoses(states[side],phase))));
 wingRibs.forEach((paths,side)=>{const lines=blendPoses(lineStates[side],phase).map(ribPath);paths.forEach((path,index)=>path?.setAttribute('d',lines[index]));});
 const lift=-.65*(1-Math.cos(2*Math.PI*(phase-.13)));
 const tilt=.65*Math.sin(2*Math.PI*phase);
 character?.setAttribute('transform','translate(0 '+lift.toFixed(3)+') rotate('+tilt.toFixed(3)+' 32 36)');
}
const actionControllers=['play','trip'].map(kind=>{
 const scene=document.querySelector('#card-'+kind);
 if(!scene) throw new Error('Missing action card: '+kind);
 return {character:scene.querySelector('#preview-'+kind+'-character'),membranes:['near','far'].map(side=>scene.querySelector('#preview-'+kind+'-'+side+'-membrane')),ribs:['near','far'].map(side=>[0,1,2].map(index=>scene.querySelector('#preview-'+kind+'-'+side+'-rib-'+index)))};
});
function renderActionWings(phase){
 const states=[poses,{down:poses.down,edge:poses.edge,up:poses.edge}];
 const lineStates=[ribs,{down:ribs.down,edge:ribs.edge,up:ribs.edge}];
 actionControllers.forEach(controller=>{
  controller.membranes.forEach((path,side)=>path?.setAttribute('d',outlinePath(blendPoses(states[side],phase))));
  controller.ribs.forEach((paths,side)=>{const lines=blendPoses(lineStates[side],phase).map(ribPath);paths.forEach((path,index)=>path?.setAttribute('d',lines[index]));});
  const lift=-.65*(1-Math.cos(2*Math.PI*(phase-.13))),tilt=.65*Math.sin(2*Math.PI*phase);
  controller.character?.setAttribute('transform','translate(0 '+lift.toFixed(3)+') rotate('+tilt.toFixed(3)+' 32 36)');
 });
}

function syncPauseButton(){
 document.body.classList.toggle("is-paused",isPaused);
 pauseButton.textContent=isPaused?'播放动画':'暂停动画';
 pauseButton.setAttribute('aria-pressed',String(isPaused));
}
pauseButton.addEventListener('click',()=>{isPaused=!isPaused;syncPauseButton();});
motionPreference.addEventListener('change',()=>{isPaused=motionPreference.matches;syncPauseButton();});
function tick(time){
 if(previousTime!==null&&!isPaused)elapsed+=Math.min(50,time-previousTime);
 previousTime=time;
 renderPhase((elapsed%1200)/1200);
 renderActionWings((elapsed%1200)/1200);
 requestAnimationFrame(tick);
}
syncPauseButton();
renderPhase(0);
requestAnimationFrame(tick);</script></body></html>
